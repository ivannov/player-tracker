# --- Database ---
quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=${DB_USER:lineup}
%dev.quarkus.datasource.password=${DB_PASSWORD:lineup}
%dev.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/lineup}
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${DB_URL}

quarkus.flyway.migrate-at-start=true
%dev.quarkus.flyway.repair-at-start=true
%dev.quarkus.flyway.clean-at-start=true

# V1 migration enables the pgvector extension, so both dev (docker-compose.yml) and test
# (Dev Services default container) need a Postgres image with pgvector installed.
%test.quarkus.datasource.devservices.image-name=pgvector/pgvector:pg17

quarkus.hibernate-orm.schema-management.strategy=none

# --- Ollama (local AI embeddings, LT-005.03) ---
# See README.md "Local AI embeddings (Ollama)" for the docker compose service and model pull.
quarkus.rest-client.ollama-api.url=${OLLAMA_URL:http://localhost:11434}
%prod.quarkus.rest-client.ollama-api.url=${OLLAMA_URL}
quarkus.rest-client.ollama-api.connect-timeout=2000
quarkus.rest-client.ollama-api.read-timeout=15000
lineup.ollama.embedding-model=nomic-embed-text

# The embedding catch-up job runs on its own schedule; tests trigger it explicitly instead so
# runs don't race against per-test fixtures.
%test.quarkus.scheduler.enabled=false

# --- Security ---
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=/login
quarkus.http.auth.form.error-page=/login?error
quarkus.http.auth.form.landing-page=/app

# Public paths no auth required
quarkus.http.auth.permission.public.paths=/,/login,/static/*
quarkus.http.auth.permission.public.policy=permit

# Everything under /app requires authentication
quarkus.http.auth.permission.authenticated.paths=/app/*
quarkus.http.auth.permission.authenticated.policy=authenticated
