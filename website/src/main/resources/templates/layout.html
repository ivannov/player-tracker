<!DOCTYPE html>
<html lang="bg" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{#insert title}Тракер на състави{/insert}</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.classless.min.css">
    <style>
        :root { --pico-font-size: 16px; }

        body > header { padding-block: 0; padding-inline: 1.5rem; }
        body > header nav { padding-block: 0; }
        body > header nav ul { padding-block: 0.1rem; margin: 0; }

        body > header nav > ul > li > strong,
        body > header nav > ul > li > details > summary,
        body > header nav > ul > li > a {
            color: #ffffff !important;
        }

        body > header nav li details > ul > li > a,
        body > header nav li details > ul > li > strong {
            color: #333333 !important;
        }

        button:not(.secondary):not(.outline),
        [role="button"]:not(.secondary):not(.outline) {
            background-color: #5c8216;
            border-color: #5c8216;
            color: #ffffff;
        }
        button:not(.secondary):not(.outline):hover,
        [role="button"]:not(.secondary):not(.outline):hover {
            background-color: #4a6a12;
            border-color: #4a6a12;
        }

        main a, footer a { color: #5c8216; }
        main a:hover, footer a:hover { color: #4a6a12; }

        footer {
            text-align: center;
            font-size: 0.85rem;
            color: var(--pico-muted-color);
        }

        /* ── Dropdown ─────────────────────────────────────────────────────── */
        nav li details { position: relative; }
        nav li details > ul {
            display: none;
            flex-direction: column;
            position: absolute;
            right: 0;
            top: calc(100% + 0.5rem);
            min-width: 14rem;
            margin: 0;
            padding: 0;
            list-style: none;
            background: var(--pico-card-background-color);
            border: var(--pico-border-width) solid var(--pico-border-color);
            border-radius: var(--pico-border-radius);
            box-shadow: 0 4px 16px rgba(0, 0, 0, .12);
            overflow: hidden;
            z-index: 999;
        }
        nav li details[open] > ul { display: flex; }
        nav li details > ul > li {
            display: block;
            width: 100%;
            padding: 0;
            margin: 0;
        }
        nav li details > ul > li > a,
        nav li details > ul > li > strong {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 0.65rem 1rem;
            margin: 0;
            white-space: nowrap;
            text-decoration: none;
            color: var(--pico-color);
        }
        nav li details > ul > li > a:hover {
            background-color: rgba(0, 0, 0, 0.06);
        }
        nav li details > ul > li > hr {
            margin: 0;
            border-color: var(--pico-border-color);
        }
        a.logout { color: var(--pico-del-color) !important; }

        /* ── Responsive ───────────────────────────────────────────────────── */
        .mobile-only { display: none; }
        @media (max-width: 767px) {
            .desktop-only { display: none; }
            .mobile-only { display: list-item; }
        }

        {#insert styles}{/insert}
    </style>
</head>
<body>
    <header style="background-color: #4e7220">
        <nav>
            <ul>
                <li><strong>Тракер на състави</strong></li>
            </ul>
            {#insert nav}{/insert}
        </nav>
    </header>

    <main>
        {#insert main}{/insert}
    </main>

    <footer>
        <p>
            Данните се извличат от
            <a href="https://ebfu.net" target="_blank" rel="noopener">ebfu.net</a>.
            {#insert footerNote}{/insert}
        </p>
    </footer>

    <form id="logout-form" method="post" action="/app/logout" hidden></form>
    <script src="https://unpkg.com/htmx.org@2/dist/htmx.min.js"></script>
    <script>
        const dropdowns = document.querySelectorAll('nav details.dropdown');
        dropdowns.forEach(d => {
            d.addEventListener('toggle', () => {
                if (d.open) dropdowns.forEach(o => { if (o !== d) o.open = false; });
            });
        });
        document.addEventListener('click', e => {
            if (!e.target.closest('nav details.dropdown')) {
                dropdowns.forEach(d => d.open = false);
            }
        });
    </script>
    {#insert scripts}{/insert}
</body>
</html>
